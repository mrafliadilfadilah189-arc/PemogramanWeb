<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah</title>

    <style>
        body {
            font-family: serif, sans-serif;
            background-color: #f4f7fb;
            margin: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c5f8a;
        }

        table {
            width: 450px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        caption {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        th, td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #d6e8f5;
            color: #244b68;
        }

        tr:hover {
            background-color: #eef6fc;
        }
    </style>
</head>

<body>
    <h1>Jadwal Kuliah</h1>

    <table>
        <caption>Jadwal Kuliah Semester 1</caption>

        <tr>
            <th>Hari</th>
            <th>Jam</th>
            <th>Mata Kuliah</th>
            <th>Ruangan</th>
        </tr>

        <tr>
            <td>Senin</td>
            <td>08:00 - 10:00</td>
            <td>Pemrograman Web</td>
            <td>Lab 1</td>
        </tr>

        <tr>
            <td>Selasa</td>
            <td>10:00 - 12:00</td>
            <td>Basis Data</td>
            <td>Lab 2</td>
        </tr>

        <tr>
            <td>Rabu</td>
            <td>08:00 - 10:00</td>
            <td>Algoritma</td>
            <td>Ruang 201</td>
        </tr>

        <tr>
            <td>Kamis</td>
            <td>13:00 - 15:00</td>
            <td>Sistem Operasi</td>
            <td>Ruang 202</td>
        </tr>

        <tr>
            <td colspan="3">Kegiatan Mahasiswa</td>
            <td>Aula</td>
        </tr>
    </table>
</body>
</html>
